spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} # local=개인 PC 스캐폴드 포함, dev=개발서버, prod=운영

thymeleaf:
  prefix: classpath:/templates/
  suffix: .html
  cache: false

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.sms.vo, com.example.sms.dto
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.sms: DEBUG
    
# 운영(prod) 환경에서 사용할 LDAP 설정 정보
ldap:
  url: ${LDAP_URL:ldap://your.ldap.server:389}
  base-dn: ${LDAP_BASE_DN:ou=users,dc=example,dc=com}

# 공통 파일 업로드 설정
app:
  upload:
    dir: ${APP_UPLOAD_DIR:C:/Work/upload}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${LOCAL_DATASOURCE_URL:${DEV_DATASOURCE_URL:jdbc:log4jdbc:oracle:thin:@localhost:1521/SMS}}
    username: ${LOCAL_DATASOURCE_USERNAME:${DEV_DATASOURCE_USERNAME:system}}
    password: ${LOCAL_DATASOURCE_PASSWORD:${DEV_DATASOURCE_PASSWORD:1234}}
    driver-class-name: ${LOCAL_DATASOURCE_DRIVER:${DEV_DATASOURCE_DRIVER:net.sf.log4jdbc.sql.jdbcapi.DriverSpy}}
    hikari:
      maximum-pool-size: ${LOCAL_DATASOURCE_MAX_POOL_SIZE:${DEV_DATASOURCE_MAX_POOL_SIZE:10}}
      minimum-idle: ${LOCAL_DATASOURCE_MIN_IDLE:${DEV_DATASOURCE_MIN_IDLE:5}}
      connection-timeout: ${LOCAL_DATASOURCE_CONNECTION_TIMEOUT:${DEV_DATASOURCE_CONNECTION_TIMEOUT:30000}}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DEV_DATASOURCE_URL:jdbc:log4jdbc:oracle:thin:@localhost:1521/SMS}
    username: ${DEV_DATASOURCE_USERNAME:system}
    password: ${DEV_DATASOURCE_PASSWORD:1234}
    driver-class-name: ${DEV_DATASOURCE_DRIVER:net.sf.log4jdbc.sql.jdbcapi.DriverSpy}
    hikari:
      maximum-pool-size: ${DEV_DATASOURCE_MAX_POOL_SIZE:10}
      minimum-idle: ${DEV_DATASOURCE_MIN_IDLE:5}
      connection-timeout: ${DEV_DATASOURCE_CONNECTION_TIMEOUT:30000}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # JBoss EAP JNDI Lookup (금융권 표준)
    jndi-name: ${PROD_DATASOURCE_JNDI_NAME:java:/comp/env/jdbc/SMS}
