<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{defaultLayout}">
<head>
    <title>MFA사용자 관리</title>
</head>
<body>
<main layout:fragment="content">

    <div class="content-header">
        <h2>MFA사용자 관리 <small style="color:#888; font-size:14px; margin-left:10px;">(기본메뉴 &gt; MFA사용자 관리)</small></h2>
    </div>

    <!-- 검색 조건 -->
    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body">
            <div class="row align-items-center g-3">

                <!-- 사용자그룹명 (콤보) -->
                <div class="col-auto">
                    <label for="userGroupCode" class="col-form-label fw-bold">사용자그룹</label>
                </div>
                <div class="col-md-2">
                    <select id="userGroupCode" class="form-select">
                        <option value="">전체</option>
                        <option value="ROLE_ADMIN">관리자</option>
                        <option value="ROLE_USER">일반사용자</option>
                    </select>
                </div>

                <div class="col-auto d-none d-lg-block">
                    <div style="height:24px; width:1px; background:#dee2e6; margin:0 8px;"></div>
                </div>

                <!-- 레벨 (콤보) -->
                <div class="col-auto">
                    <label for="userRole" class="col-form-label fw-bold">레벨</label>
                </div>
                <div class="col-md-2">
                    <select id="userRole" class="form-select">
                        <option value="">전체</option>
                        <option value="ROLE_ADMIN">관리자</option>
                        <option value="ROLE_USER">일반사용자</option>
                    </select>
                </div>

                <div class="col-auto d-none d-xl-block">
                    <div style="height:24px; width:1px; background:#dee2e6; margin:0 8px;"></div>
                </div>

                <!-- 사용자명 -->
                <div class="col-auto">
                    <label for="empName" class="col-form-label fw-bold">사용자명</label>
                </div>
                <div class="col-md-2">
                    <input type="text" id="empName" class="form-control" placeholder="사용자명 입력">
                </div>

                <div class="col-auto d-none d-xl-block">
                    <div style="height:24px; width:1px; background:#dee2e6; margin:0 8px;"></div>
                </div>

                <!-- 사용자ID -->
                <div class="col-auto">
                    <label for="empId" class="col-form-label fw-bold">사용자ID</label>
                </div>
                <div class="col-md-2">
                    <input type="text" id="empId" class="form-control" placeholder="사용자ID 입력">
                </div>

                <!-- 액션 버튼 -->
                <div class="col-auto ms-auto d-flex gap-2">
                    <button type="button" id="btn-search" class="btn btn-primary px-4">조회</button>
                    <button type="button" id="btn-reset"  class="btn btn-secondary px-3">초기화</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 그리드 -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
            <span class="fs-6 fw-medium">총 <strong class="text-primary" id="total-count">0</strong>건</span>
            <div class="d-flex align-items-center gap-2">
                <span class="text-muted" style="font-size:0.85rem;">페이지당</span>
                <select id="pageSizeSelect" class="form-select form-select-sm" style="width:80px;">
                    <option value="10">10건</option>
                    <option value="20">20건</option>
                    <option value="50">50건</option>
                </select>
            </div>
        </div>
        <div class="card-body p-0">
            <div id="grid" style="width:100%;"></div>
        </div>
        <div class="card-footer bg-white border-0 py-3">
            <div id="pagination" class="d-flex justify-content-center"></div>
        </div>
    </div>

</main>

<th:block layout:fragment="script">
    <script th:src="@{/js/basic/mfa-manage.js}"></script>
</th:block>
</body>
</html>
