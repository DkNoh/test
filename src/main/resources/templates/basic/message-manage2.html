<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{defaultLayout}">
<head>
    <title>환율조회</title>
</head>
<body>
<main layout:fragment="content">
    <div class="content-header">
        <h2>환율조회 <small style="color:#888; font-size:14px; margin-left:10px;">(basic > notice)</small></h2>
    </div>

    <div class="search-section">
        <div class="search-row">
            <span class="search-label">검색어</span>
            <input type="text" id="searchKeyword" class="search-input" placeholder="검색어 입력">
            
            <div class="search-divider"></div>
            
            <div class="search-actions">
                <button type="button" class="btn btn-primary" id="btn-search">조회</button>
                <button type="button" class="btn btn-secondary" id="btn-reset">초기화</button>
                <button type="button" class="btn btn-success" id="btn-excel" style="margin-left:5px;">대용량 엑셀 다운로드</button>
                <button type="button" class="btn btn-info" id="btn-excel-grid" style="margin-left:5px;">현재 화면 엑셀 다운로드</button>
            </div>
        </div>
    </div>

    <div class="grid-toolbar">
        <span class="total-count">총 <strong>0</strong>건</span>
        <div class="page-size-wrap">
            페이지당
            <select id="pageSizeSelect">
                <option value="10">10건</option>
                <option value="20">20건</option>
                <option value="50">50건</option>
            </select>
            <button type="button" class="btn btn-success btn-sm" id="btn-create">+ 신규 등록</button>
        </div>
    </div>

    <div id="grid"></div>
    <div id="pagination" class="pagination-wrap"></div>
</main>

<th:block layout:fragment="script">
    <script th:src="@{/js/basic/notice-manage.js}"></script>
</th:block>
</body>
</html>
