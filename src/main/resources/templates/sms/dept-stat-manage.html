<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{defaultLayout}">
<head>
    <title>시간대별조회</title>
    <style>
        /* Progress 바 차트 행 */
        .chart-row            { display:flex; align-items:center; gap:10px; margin-bottom:5px; }
        .chart-row-label      { width:36px; text-align:right; font-size:.78rem; font-weight:600; color:#6c757d; flex-shrink:0; }
        .chart-row-track      { flex:1; height:20px; background:#e9ecef; border-radius:6px; overflow:hidden; display:flex; transition:filter .15s; }
        .chart-row-track:hover{ filter:brightness(.95); }
        .chart-row-count      { width:52px; text-align:right; font-size:.78rem; font-weight:600; flex-shrink:0; }
        .chart-seg            { height:100%; transition:width .55s cubic-bezier(.4,0,.2,1); }
    </style>
</head>
<body>
<main layout:fragment="content">

    <!-- 헤더 -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h4 class="mb-0 fw-semibold">
            시간대별조회
            <small class="text-muted fs-6 ms-2 fw-normal">(시스템관리 &gt; 시간대별조회)</small>
        </h4>
    </div>

    <!-- 검색 -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row align-items-center g-3">
                <div class="col-auto">
                    <label for="searchDate" class="form-label fw-semibold mb-0">조회일자</label>
                </div>
                <div class="col-auto">
                    <input type="date" id="searchDate" class="form-control" style="width:170px;">
                </div>
                <div class="col-auto">
                    <button type="button" id="btn-search" class="btn btn-primary px-4">조회</button>
                    <button type="button" id="btn-reset"  class="btn btn-outline-secondary px-3 ms-2">초기화</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 메트릭 카드 (CoreUI border-start 위젯 패턴) -->
    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-xl-3">
            <div class="card border-start border-4 border-secondary h-100">
                <div class="card-body">
                    <div class="text-uppercase text-muted small fw-semibold mb-1">총 발송</div>
                    <div class="fs-2 fw-bold text-secondary mb-1" id="m-total">—</div>
                    <div class="text-muted small">전체 건수</div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card border-start border-4 border-success h-100">
                <div class="card-body">
                    <div class="text-uppercase text-muted small fw-semibold mb-1">성공</div>
                    <div class="fs-2 fw-bold text-success mb-1" id="m-success">—</div>
                    <div class="text-muted small">성공률 <strong id="m-srate" class="text-success">—</strong></div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card border-start border-4 border-danger h-100">
                <div class="card-body">
                    <div class="text-uppercase text-muted small fw-semibold mb-1">실패</div>
                    <div class="fs-2 fw-bold text-danger mb-1" id="m-fail">—</div>
                    <div class="text-muted small">실패율 <strong id="m-frate" class="text-danger">—</strong></div>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card border-start border-4 border-warning h-100">
                <div class="card-body">
                    <div class="text-uppercase text-muted small fw-semibold mb-1">전송중</div>
                    <div class="fs-2 fw-bold text-warning mb-1" id="m-sending">—</div>
                    <div class="text-muted small">비율 <strong id="m-wrate" class="text-warning">—</strong></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 바 차트 -->
    <div class="card mb-4">
        <div class="card-header d-flex align-items-center gap-3">
            <span class="fw-semibold">시간대별 발송 현황</span>
            <div class="d-flex gap-3 ms-auto">
                <span class="d-flex align-items-center gap-1 small text-muted">
                    <span style="width:10px;height:10px;border-radius:50%;background:#198754;display:inline-block;"></span>성공
                </span>
                <span class="d-flex align-items-center gap-1 small text-muted">
                    <span style="width:10px;height:10px;border-radius:50%;background:#dc3545;display:inline-block;"></span>실패
                </span>
                <span class="d-flex align-items-center gap-1 small text-muted">
                    <span style="width:10px;height:10px;border-radius:50%;background:#ffc107;display:inline-block;"></span>전송중
                </span>
            </div>
        </div>
        <div class="card-body" id="chart-bars">
            <div class="text-center text-muted py-5">
                <i class="text-muted" style="font-size:2rem;">📊</i>
                <p class="mt-2 mb-0">조회일자를 선택하고 조회 버튼을 클릭하세요.</p>
            </div>
        </div>
    </div>

    <!-- 상세 테이블 -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span class="fw-semibold">시간대별 상세</span>
            <span class="text-muted small" id="detail-date"></span>
        </div>
        <div class="card-body p-0" id="detail-table">
            <div class="text-center text-muted py-4">조회 결과가 여기에 표시됩니다.</div>
        </div>
    </div>

</main>
<th:block layout:fragment="script">
    <script th:src="@{/js/sms/dept-stat-manage.js}"></script>
</th:block>
</body>
</html>
