<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{defaultLayout}">
<head><title>알림톡 등록</title></head>
<body>
<main layout:fragment="content">

    <div class="content-header">
        <h2>알림톡 등록 <small style="color:#888;font-size:14px;margin-left:10px;">(캠페인 SMS &gt; 알림톡등록)</small></h2>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body px-4 py-4">
            <table class="table table-borderless table-sm align-middle mb-0">
                <colgroup><col style="width:140px;"><col></colgroup>
                <tbody>
                    <tr>
                        <th class="text-muted fw-bold">캠페인명 <span class="text-danger">*</span></th>
                        <td><input type="text" id="campaignName" class="form-control" placeholder="캠페인 이름 입력"></td>
                    </tr>
                    <tr>
                        <th class="text-muted fw-bold">카카오 템플릿</th>
                        <td>
                            <select id="templateCode" class="form-select" style="width:300px;">
                                <option value="">템플릿 선택</option>
                            </select>
                            <small class="text-muted">시스템관리 &gt; 카카오템플릿관리에서 등록된 템플릿 선택</small>
                        </td>
                    </tr>
                    <tr>
                        <th class="text-muted fw-bold">수신번호 <span class="text-danger">*</span></th>
                        <td>
                            <textarea id="receiverNos" class="form-control" rows="4" placeholder="수신번호를 줄바꿈으로 구분하여 입력"></textarea>
                        </td>
                    </tr>
                    <tr>
                        <th class="text-muted fw-bold">메세지 내용 <span class="text-danger">*</span></th>
                        <td>
                            <textarea id="msgContent" class="form-control" rows="6" placeholder="알림톡 내용 입력"></textarea>
                        </td>
                    </tr>
                    <tr>
                        <th class="text-muted fw-bold">예약발송일시</th>
                        <td><input type="datetime-local" id="reservedAt" class="form-control" style="width:200px;"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-light border-top px-4 py-3 d-flex gap-2">
            <button type="button" id="btn-submit" class="btn btn-primary px-4">승인 요청</button>
            <button type="button" onclick="history.back()" class="btn btn-secondary px-4">취소</button>
        </div>
    </div>

</main>
<th:block layout:fragment="script">
    <script th:src="@{/js/campaign/alimtalk-register.js}"></script>
</th:block>
</body>
</html>
