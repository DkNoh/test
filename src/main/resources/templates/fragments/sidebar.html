<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <!-- CoreUI Sidebar 컴포넌트 -->
    <div class="sidebar bg-white border-end shadow-sm" data-coreui-theme="light" id="sidebar" th:fragment="sidebar" style="color: #495057;">
        
        <!-- 로고/타이틀 영역 -->
        <div class="sidebar-brand d-md-flex bg-white border-bottom border-light">
            <div class="sidebar-brand-full d-flex align-items-center w-100 px-3">
                <img th:src="@{/img/SC.png}" alt="SC 로고" width="28" height="28" class="me-2 flex-shrink-0">
                <span class="fs-5 fw-bold text-truncate text-dark">SMS전송시스템</span>
            </div>
            <!-- Collapsed 상태일 때 보일 로고 (평소엔 숨김) -->
            <div class="sidebar-brand-narrow d-none align-items-center">
                <img th:src="@{/img/SC.png}" alt="SC 로고" width="28" height="28">
            </div>
        </div>

        <!-- 접속 정보 영역 (Collapsed 시 숨김 처리 됨) -->
        <div class="px-3 py-2 bg-light border-bottom sidebar-brand-full" style="font-size: 12px; color: #6c757d;">
            <div class="mb-1 text-truncate"><strong>IP:</strong> <span th:text="${session.loginIp} ?: '127.0.0.1'">127.0.0.1</span></div>
            <div class="text-truncate"><strong>TIME:</strong> <span th:text="${session.loginTime} ?: '접속 시간 대기'"></span></div>
        </div>

        <!-- 메뉴 목록 -->
        <ul class="sidebar-nav" data-coreui="navigation" data-simplebar="">
            <th:block th:if="${session.userMenus != null}">
                
                <li class="nav-group" th:each="parentMenu : ${session.userMenus}">
                    <a class="nav-link nav-group-toggle" href="#">
                        <!-- 동적 아이콘 매핑 (메뉴명 기준) -->
                        <th:block th:switch="${parentMenu.menuNm}">
                            <!-- 주소록 관련 -->
                            <svg th:case="'주소록 관리'" class="nav-icon flex-shrink-0" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                            </svg>
                            <!-- 캠페인/전송 관련 -->
                            <svg th:case="'캠페인 관리'" class="nav-icon flex-shrink-0" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                            </svg>
                            <!-- 결재 관련 -->
                            <svg th:case="'결재 관리'" class="nav-icon flex-shrink-0" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
                            </svg>
                            <!-- 시스템 관련 -->
                            <svg th:case="'시스템 관리'" class="nav-icon flex-shrink-0" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.99,0-3.6-1.61-3.6-3.6 s1.61-3.6,3.6-3.6s3.6,1.61,3.6,3.6S13.99,15.6,12,15.6z"/>
                            </svg>
                            <!-- 결과 관련 -->
                            <svg th:case="'결과 조회'" class="nav-icon flex-shrink-0" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
                            </svg>
                            <!-- 기본 아이콘 -->
                            <svg th:case="*" class="nav-icon flex-shrink-0" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z" />
                            </svg>
                        </th:block>
                        <span th:text="${parentMenu.menuNm}" class="text-truncate">메뉴 그룹</span>
                    </a>
                    <ul class="nav-group-items">
                        <li class="nav-item" th:each="childMenu : ${parentMenu.subMenus}">
                            <a class="nav-link text-truncate" th:href="@{${childMenu.menuUrl != null ? childMenu.menuUrl : '#'}}" th:text="${childMenu.menuNm}">
                                하위 링크
                            </a>
                        </li>
                    </ul>
                </li>
            </th:block>

            <th:block th:if="${session.userMenus == null or #lists.isEmpty(session.userMenus)}">
                <li class="nav-item p-3 text-danger text-center" style="font-size: 13px;">
                    <span class="sidebar-brand-full">허용된 메뉴 권한이<br>존재하지 않습니다.</span>
                </li>
            </th:block>
        </ul>
    </div>
</body>

</html>
