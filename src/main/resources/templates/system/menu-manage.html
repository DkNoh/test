<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{defaultLayout}">
<head>
    <title>메뉴/권한 관리</title>
</head>
<body>
<main layout:fragment="content">
    
    <!-- 타이틀 영역 -->
    <div class="row mb-4">
        <div class="col-12">
            <h4 class="mb-0 fw-bold">메뉴 및 권한 관리 <span class="text-muted fs-6 ms-2">(시스템 설정)</span></h4>
        </div>
    </div>

    <!-- 검색 조건 (Card) -->
    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body">
            <div class="row align-items-center g-3">
                
                <!-- 메뉴명/코드 -->
                <div class="col-auto">
                    <label for="searchKeyword" class="col-form-label fw-bold">메뉴명/코드</label>
                </div>
                <div class="col-md-3">
                    <input type="text" id="searchKeyword" class="form-control" placeholder="메뉴명 또는 코드 입력">
                </div>
                
                <div class="col-auto d-none d-lg-block">
                    <div style="height: 24px; width: 1px; background-color: #dee2e6; margin: 0 8px;"></div>
                </div>

                <!-- 사용여부 -->
                <div class="col-auto">
                    <label for="useYn" class="col-form-label fw-bold">사용여부</label>
                </div>
                <div class="col-md-2">
                    <select id="useYn" class="form-select">
                        <option value="">전체</option>
                        <option value="Y">Y (사용)</option>
                        <option value="N">N (미사용)</option>
                    </select>
                </div>

                <!-- 액션 버튼 -->
                <div class="col-auto ms-auto d-flex gap-2">
                    <button type="button" class="btn btn-primary px-4" id="btn-search">조회</button>
                    <button type="button" class="btn btn-secondary px-3" id="btn-reset">초기화</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 메인 영역 (Split 레이아웃 -> 반응형 Bootstrap Grid 교체) -->
    <div class="row g-4">
        
        <!-- 좌측: 메뉴 목록 그리드 -->
        <div class="col-lg-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-white d-flex justify-content-between align-items-center py-3 border-bottom-0">
                    <span class="fs-6 fw-medium">총 <strong class="text-primary" id="total-count">0</strong>건</span>
                    
                    <div class="d-flex align-items-center gap-2">
                        <button type="button" class="btn btn-success btn-sm px-3 shadow-none" id="btn-new">+ 신규 메뉴</button>
                    </div>
                </div>
                
                <div class="card-body p-0">
                    <div id="grid" style="width: 100%;"></div>
                </div>
                
                <div class="card-footer bg-white border-0 py-3">
                    <!-- 페이지네이션 -->
                    <div id="pagination" class="d-flex justify-content-center"></div>
                </div>
            </div>
        </div>

        <!-- 우측: 상세 폼 및 권한 매핑 -->
        <div class="col-lg-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-light border-bottom py-3">
                    <h5 class="mb-0 fw-bold">메뉴 상세 정보</h5>
                </div>
                <div class="card-body p-4">
                    <input type="hidden" id="editMode" value="1"> <!-- 1:신규, 2:수정 -->
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted mb-1">메뉴 코드 (필수)</label>
                        <input type="text" id="menuCd" class="form-control" placeholder="예: M_USER">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted mb-1">상위 메뉴 코드</label>
                        <input type="text" id="upMenuCd" class="form-control" placeholder="최상위면 비워둠">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted mb-1">메뉴 명 (필수)</label>
                        <input type="text" id="menuNm" class="form-control" placeholder="예: 사용자 관리">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted mb-1">URL</label>
                        <input type="text" id="menuUrl" class="form-control" placeholder="예: /account/user">
                    </div>
                    
                    <div class="row g-3 mb-4">
                        <div class="col-sm-6">
                            <label class="form-label fw-bold text-muted mb-1">정렬 순서</label>
                            <input type="number" id="sortOrd" class="form-control" value="1">
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label fw-bold text-muted mb-1">사용 여부</label>
                            <select id="dtlUseYn" class="form-select">
                                <option value="Y">Y</option>
                                <option value="N">N</option>
                            </select>
                        </div>
                    </div>

                    <div class="card border-light bg-light mb-4">
                        <div class="card-body p-3">
                            <h6 class="fw-bold mb-3">접근 허용 권한 (ROLE)</h6>
                            <div id="authList" class="d-flex flex-column gap-2" style="max-height: 150px; overflow-y: auto;">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="authRoles" id="authRoleAdmin" value="ROLE_ADMIN">
                                    <label class="form-check-label" for="authRoleAdmin">ROLE_ADMIN (최고관리자)</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="authRoles" id="authRoleManager" value="ROLE_MANAGER">
                                    <label class="form-check-label" for="authRoleManager">ROLE_MANAGER (부서관리자)</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="authRoles" id="authRoleUser" value="ROLE_USER">
                                    <label class="form-check-label" for="authRoleUser">ROLE_USER (일반사용자)</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="authRoles" id="authRoleViewer" value="ROLE_VIEWER">
                                    <label class="form-check-label" for="authRoleViewer">ROLE_VIEWER (조회전용)</label>
                                </div>
                            </div>

                            <h6 class="fw-bold mt-4 mb-3">액션 권한</h6>
                            <div class="table-responsive">
                                <table class="table table-sm align-middle mb-0">
                                    <thead>
                                    <tr>
                                        <th>역할</th>
                                        <th class="text-center">READ</th>
                                        <th class="text-center">WRITE</th>
                                        <th class="text-center">APPROVE</th>
                                        <th class="text-center">EXCEL</th>
                                    </tr>
                                    </thead>
                                    <tbody id="actionAuthList">
                                    <tr data-role="ROLE_ADMIN">
                                        <td>ADMIN</td>
                                        <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_ADMIN" data-action="canRead" checked></td>
                                        <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_ADMIN" data-action="canWrite" checked></td>
                                        <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_ADMIN" data-action="canApprove" checked></td>
                                        <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_ADMIN" data-action="canExcel" checked></td>
                                    </tr>
                                    <tr data-role="ROLE_MANAGER">
                                        <td>MANAGER</td>
                                        <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_MANAGER" data-action="canRead" checked></td>
                                        <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_MANAGER" data-action="canWrite" checked></td>
                                        <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_MANAGER" data-action="canApprove"></td>
                                        <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_MANAGER" data-action="canExcel" checked></td>
                                    </tr>
                                    <tr data-role="ROLE_USER">
                                        <td>USER</td>
                                        <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_USER" data-action="canRead" checked></td>
                                        <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_USER" data-action="canWrite"></td>
                                        <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_USER" data-action="canApprove"></td>
                                        <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_USER" data-action="canExcel"></td>
                                    </tr>
                                    <tr data-role="ROLE_VIEWER">
                                        <td>VIEWER</td>
                                        <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_VIEWER" data-action="canRead" checked></td>
                                        <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_VIEWER" data-action="canWrite"></td>
                                        <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_VIEWER" data-action="canApprove"></td>
                                        <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_VIEWER" data-action="canExcel" checked></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 align-items-center border-top pt-3">
                        <button type="button" class="btn btn-danger px-4" id="btn-delete" style="display:none;">삭제</button>
                        <div class="ms-auto d-flex gap-2">
                            <button type="button" class="btn btn-secondary px-4" id="btn-cancel">취소</button>
                            <button type="button" class="btn btn-primary px-4" id="btn-save">저장</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>

</main>

<th:block layout:fragment="script">
    <script th:src="@{/js/system/menu-manage.js}"></script>
    <script>
        // CoreUI 렌더링 완료 후 폭 조정
        setTimeout(() => {
            if (typeof grid !== 'undefined' && grid) grid.refreshLayout();
        }, 100);
    </script>
</th:block>
</body>
</html>
