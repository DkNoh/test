<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{defaultLayout}">
<head>
    <title>메뉴 관리(트리형)</title>
    <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
    <style>
        .auth-check-list {
            border: 1px solid #ced4da;
            background: #fff;
            padding: 12px;
            border-radius: 6px;
            max-height: 160px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
<main layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0 fw-bold">메뉴 및 권한 관리 <span class="text-muted fs-6 ms-2">(Tree)</span></h4>
        <button class="btn btn-secondary btn-sm" onclick="location.href='/system/menu-manage'">
            테이블형으로 이동
        </button>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
                    <h6 class="mb-0 fw-bold">메뉴 계층 구조</h6>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-outline-primary" id="btn-add-child">하위 추가</button>
                        <button class="btn btn-sm btn-outline-info" id="btn-add-sibling">동급 추가</button>
                        <button class="btn btn-sm btn-outline-danger" id="btn-delete-node">선택 삭제</button>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div id="tree-grid"></div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-white border-bottom py-3">
                    <h6 class="mb-0 fw-bold">메뉴 상세 및 권한</h6>
                </div>
                <div class="card-body bg-light">
                    <input type="hidden" id="editMode" value="1">

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark">메뉴 코드 <span class="text-danger">*</span></label>
                        <input type="text" id="menuCd" class="form-control" placeholder="예: M_USER">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark">상위 메뉴 코드</label>
                        <input type="text" id="upMenuCd" class="form-control bg-white" placeholder="최상위 메뉴는 비워둠" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark">메뉴명 <span class="text-danger">*</span></label>
                        <input type="text" id="menuNm" class="form-control" placeholder="예: 사용자 관리">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark">URL 경로</label>
                        <input type="text" id="menuUrl" class="form-control" placeholder="예: /account/user-manage">
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-6">
                            <label class="form-label fw-semibold text-dark">정렬 순서</label>
                            <input type="number" id="sortOrd" class="form-control" value="1">
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-semibold text-dark">사용 여부</label>
                            <select id="dtlUseYn" class="form-select">
                                <option value="Y">사용 (Y)</option>
                                <option value="N">미사용 (N)</option>
                            </select>
                        </div>
                    </div>

                    <label class="form-label fw-semibold text-dark">접근 허용 권한</label>
                    <div class="auth-check-list mb-4" id="authList">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="authRoles" value="ROLE_ADMIN" id="treeRoleAdmin">
                            <label class="form-check-label text-dark" for="treeRoleAdmin">ROLE_ADMIN (최고관리자)</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="authRoles" value="ROLE_MANAGER" id="treeRoleManager">
                            <label class="form-check-label text-dark" for="treeRoleManager">ROLE_MANAGER (부서관리자)</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="authRoles" value="ROLE_USER" id="treeRoleUser">
                            <label class="form-check-label text-dark" for="treeRoleUser">ROLE_USER (일반사용자)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="authRoles" value="ROLE_VIEWER" id="treeRoleViewer">
                            <label class="form-check-label text-dark" for="treeRoleViewer">ROLE_VIEWER (조회전용)</label>
                        </div>
                    </div>

                    <h6 class="fw-bold mb-3">액션 권한</h6>
                    <div class="table-responsive mb-4">
                        <table class="table table-sm align-middle bg-white mb-0">
                            <thead>
                            <tr>
                                <th>역할</th>
                                <th class="text-center">READ</th>
                                <th class="text-center">WRITE</th>
                                <th class="text-center">APPROVE</th>
                                <th class="text-center">EXCEL</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td>ADMIN</td>
                                <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_ADMIN" data-action="canRead" checked></td>
                                <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_ADMIN" data-action="canWrite" checked></td>
                                <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_ADMIN" data-action="canApprove" checked></td>
                                <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_ADMIN" data-action="canExcel" checked></td>
                            </tr>
                            <tr>
                                <td>MANAGER</td>
                                <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_MANAGER" data-action="canRead" checked></td>
                                <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_MANAGER" data-action="canWrite" checked></td>
                                <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_MANAGER" data-action="canApprove"></td>
                                <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_MANAGER" data-action="canExcel" checked></td>
                            </tr>
                            <tr>
                                <td>USER</td>
                                <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_USER" data-action="canRead" checked></td>
                                <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_USER" data-action="canWrite"></td>
                                <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_USER" data-action="canApprove"></td>
                                <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_USER" data-action="canExcel"></td>
                            </tr>
                            <tr>
                                <td>VIEWER</td>
                                <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_VIEWER" data-action="canRead" checked></td>
                                <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_VIEWER" data-action="canWrite"></td>
                                <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_VIEWER" data-action="canApprove"></td>
                                <td class="text-center"><input type="checkbox" name="authAction" data-role="ROLE_VIEWER" data-action="canExcel" checked></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-grid">
                        <button type="button" class="btn btn-primary" id="btn-save">저장 및 반영</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block layout:fragment="script">
    <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
    <script th:src="@{/js/system/menu-tree.js}"></script>
</th:block>
</body>
</html>
