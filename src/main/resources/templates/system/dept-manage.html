<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{defaultLayout}">
<head>
    <title>부서 관리</title>
</head>
<body>
<main layout:fragment="content">
    
    <!-- 타이틀 영역 -->
    <div class="row mb-4">
        <div class="col-12">
            <h4 class="mb-0 fw-bold">부서 관리 <span class="text-muted fs-6 ms-2">(시스템 관리 > 부서 관리)</span></h4>
        </div>
    </div>

    <!-- 검색 조건 (Card) -->
    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body">
            <div class="row align-items-center g-3">
                
                <!-- 부서코드 -->
                <div class="col-auto">
                    <label for="deptId" class="col-form-label fw-bold">부서코드</label>
                </div>
                <div class="col-md-2">
                    <input type="text" id="deptId" class="form-control" placeholder="코드 입력">
                </div>

                <div class="col-auto d-none d-lg-block">
                    <div style="height: 24px; width: 1px; background-color: #dee2e6; margin: 0 8px;"></div>
                </div>

                <!-- 부서명 -->
                <div class="col-auto">
                    <label for="depNm" class="col-form-label fw-bold">부서명</label>
                </div>
                <div class="col-md-3">
                    <input type="text" id="depNm" class="form-control" placeholder="부서명 입력">
                </div>

                <!-- 액션 버튼 -->
                <div class="col-auto ms-auto d-flex gap-2">
                    <button type="button" id="btn-search" class="btn btn-primary px-4">조회</button>
                    <button type="button" id="btn-reset" class="btn btn-secondary px-3">초기화</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 메인 데이터 그리드 (Card) -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white d-flex justify-content-between align-items-center py-3 border-bottom-0">
            <span class="fs-6 fw-medium">총 <strong class="text-primary" id="total-count">0</strong>건</span>
            
            <div class="d-flex align-items-center gap-3">
                <div class="d-flex align-items-center gap-2">
                    <span class="text-muted" style="font-size: 0.85rem;">페이지당</span>
                    <select id="pageSizeSelect" class="form-select form-select-sm" style="width: 80px;">
                        <option value="10">10건</option>
                        <option value="20">20건</option>
                        <option value="50">50건</option>
                        <option value="100">100건</option>
                    </select>
                </div>
                
                <div class="border-start ps-3">
                    <button type="button" class="btn btn-success btn-sm px-3 shadow-none" id="btn-create">신규 부서 등록</button>
                </div>
            </div>
        </div>
        
        <div class="card-body p-0">
            <div id="grid" style="width: 100%;"></div>
        </div>
        
        <div class="card-footer bg-white border-0 py-3">
            <div id="pagination" class="d-flex justify-content-center"></div>
        </div>
    </div>

    <!-- 신규 부서 등록 모달 -->
    <div class="modal-overlay" id="createModal" onclick="CommonUtils.closeModalOnOverlay(event)" style="display:none;">
        <div class="modal-box card border-0 shadow-lg" style="width: 450px; border-radius: 12px;">
            <div class="modal-header bg-light border-bottom px-4 py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold">부서 등록</h5>
                <button type="button" class="btn-close" onclick="document.getElementById('createModal').style.display='none'"></button>
            </div>
            
            <div class="modal-body px-4 py-4">
                <table class="table table-borderless table-sm mb-0 align-middle">
                    <colgroup>
                        <col style="width: 100px;">
                        <col style="width: auto;">
                    </colgroup>
                    <tbody>
                        <tr>
                            <th class="text-muted fw-bold">부서코드</th>
                            <td>
                                <input type="text" id="c-deptId" class="form-control" placeholder="부서코드 입력 (예: D001)">
                            </td>
                        </tr>
                        <tr>
                            <th class="text-muted fw-bold">부서명</th>
                            <td>
                                <input type="text" id="c-depNm" class="form-control" placeholder="부서명 입력">
                            </td>
                        </tr>
                        <tr>
                            <th class="text-muted fw-bold">사용여부</th>
                            <td>
                                <div class="d-flex gap-3 mt-1">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="c-actYn" id="actYn-Y" value="Y" checked>
                                        <label class="form-check-label" for="actYn-Y">사용</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="c-actYn" id="actYn-N" value="N">
                                        <label class="form-check-label" for="actYn-N">미사용</label>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div class="modal-footer bg-light border-top px-4 py-3 gap-2">
                <button type="button" class="btn btn-primary px-4" id="btn-save-dept">저장</button>
                <button type="button" class="btn btn-secondary px-4" onclick="document.getElementById('createModal').style.display='none'">닫기</button>
            </div>
        </div>
    </div>

</main>

<th:block layout:fragment="script">
    <script th:src="@{/js/system/dept-manage.js}"></script>
    <script>
        setTimeout(() => {
            if (typeof grid !== 'undefined' && grid) grid.refreshLayout();
        }, 100);
    </script>
</th:block>
</body>
</html>
