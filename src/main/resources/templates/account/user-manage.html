<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{defaultLayout}">

<head>
    <title>사용자 계정 관리</title>
</head>

<body>
<main layout:fragment="content">
    
    <!-- 타이틀 영역 -->
    <div class="row mb-4">
        <div class="col-12">
            <h4 class="mb-0 fw-bold">사용자 계정 관리 <span class="text-muted fs-6 ms-2">(시스템 관리 > 계정 관리)</span></h4>
        </div>
    </div>

    <!-- 검색 조건 (Card) -->
    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body">
            <div class="row align-items-center g-3">
                
                <div class="col-auto">
                    <label for="deptId" class="col-form-label fw-bold">부서코드</label>
                </div>
                <div class="col-md-2">
                    <input type="text" id="deptId" class="form-control" placeholder="부서코드 입력">
                </div>

                <div class="col-auto d-none d-lg-block">
                    <div style="height: 24px; width: 1px; background-color: #dee2e6; margin: 0 8px;"></div>
                </div>

                <div class="col-auto">
                    <label for="empName" class="col-form-label fw-bold">사용자명</label>
                </div>
                <div class="col-md-2">
                    <input type="text" id="empName" class="form-control" placeholder="사용자명 입력">
                </div>

                <div class="col-auto d-none d-xl-block">
                    <div style="height: 24px; width: 1px; background-color: #dee2e6; margin: 0 8px;"></div>
                </div>

                <div class="col-auto">
                    <label for="empId" class="col-form-label fw-bold">사용자ID</label>
                </div>
                <div class="col-md-2">
                    <input type="text" id="empId" class="form-control" placeholder="사용자ID 입력">
                </div>

                <!-- 액션 버튼 -->
                <div class="col-auto ms-auto d-flex gap-2">
                    <button type="button" id="btn-search" class="btn btn-primary px-4">조회</button>
                    <button type="button" id="btn-reset" class="btn btn-secondary px-3">초기화</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 메인 데이터 그리드 (Card) -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white d-flex justify-content-between align-items-center py-3 border-bottom-0">
            <span class="fs-6 fw-medium">총 <strong class="text-primary" id="total-count">0</strong>건</span>
            
            <div class="d-flex align-items-center gap-3">
                <button type="button" id="btn-create" class="btn btn-primary btn-sm px-3 shadow-none">계정 생성</button>
                <div class="d-flex align-items-center gap-2 border-start ps-3">
                    <span class="text-muted" style="font-size: 0.85rem;">페이지당</span>
                    <select id="pageSizeSelect" class="form-select form-select-sm" style="width: 80px;">
                        <option value="10">10건</option>
                        <option value="20">20건</option>
                        <option value="50">50건</option>
                        <option value="100">100건</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="card-body p-0">
            <div id="grid" style="width: 100%;"></div>
        </div>
        
        <div class="card-footer bg-white border-0 py-3">
            <div id="pagination" class="d-flex justify-content-center"></div>
        </div>
    </div>

    <!-- 계정 생성 모달 -->
    <div class="modal-overlay" id="createModal" onclick="CommonUtils.closeModalOnOverlay(event)" style="display:none;">
        <div class="modal-box card border-0 shadow-lg" style="width: 500px; border-radius: 12px;">
            <div class="modal-header bg-light border-bottom px-4 py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold">계정 생성</h5>
                <button type="button" class="btn-close" onclick="document.getElementById('createModal').style.display='none'"></button>
            </div>
            
            <div class="modal-body px-4 py-4">
                <table class="table table-borderless table-sm mb-0 align-middle">
                    <colgroup>
                        <col style="width: 120px;">
                        <col style="width: auto;">
                    </colgroup>
                    <tbody>
                        <tr>
                            <th class="text-muted fw-bold">사용자ID</th>
                            <td>
                                <input type="text" id="c-empId" class="form-control" placeholder="사번/ID 입력">
                            </td>
                        </tr>
                        <tr>
                            <th class="text-muted fw-bold">사용자명</th>
                            <td>
                                <input type="text" id="c-empName" class="form-control" placeholder="이름 입력">
                            </td>
                        </tr>
                        <tr>
                            <th class="text-muted fw-bold">부서코드</th>
                            <td>
                                <input type="text" id="c-deptId" class="form-control" placeholder="부서코드 입력">
                            </td>
                        </tr>
                        <tr>
                            <th class="text-muted fw-bold">역할</th>
                            <td>
                                <select id="c-userRole" class="form-select">
                                    <option value="ROLE_USER">일반사용자</option>
                                    <option value="ROLE_ADMIN">시스템관리자</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <th class="text-muted fw-bold">권한</th>
                            <td>
                                <div class="d-flex gap-3 mt-1">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="c-authRead" checked>
                                        <label class="form-check-label" for="c-authRead">조회</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="c-authApprove">
                                        <label class="form-check-label" for="c-authApprove">승인</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="c-authCampaign">
                                        <label class="form-check-label" for="c-authCampaign">캠페인</label>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <th class="text-muted fw-bold">사용여부</th>
                            <td>
                                <div class="d-flex gap-3 mt-1">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="c-useYn" id="useYn-Y" value="Y" checked>
                                        <label class="form-check-label" for="useYn-Y">사용</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="c-useYn" id="useYn-N" value="N">
                                        <label class="form-check-label" for="useYn-N">미사용</label>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div class="modal-footer bg-light border-top px-4 py-3 gap-2">
                <button type="button" class="btn btn-primary px-4" id="btn-save-user">저장</button>
                <button type="button" class="btn btn-secondary px-4" onclick="document.getElementById('createModal').style.display='none'">닫기</button>
            </div>
        </div>
    </div>

</main>

<th:block layout:fragment="script">
    <script th:src="@{/js/account/user-manage.js}"></script>
</th:block>

</body>
</html>
